name: ECPE v3 exact-head cross-platform proof

on:
  push:
    branches:
      - ci/ecpe-v3-cross-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecpe-v3-exact-head-proof
  cancel-in-progress: true

env:
  ECPE_TARGET_SHA: d33af9ba5936527661888fb46eacf46370f7591e

jobs:
  linux-free-suite:
    name: Linux full free suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.ECPE_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ECPE_TARGET_SHA"
          mkdir -p .ci-evidence
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "target_sha=$ECPE_TARGET_SHA"
            echo "actual_sha=$(git rev-parse HEAD)"
          } > .ci-evidence/linux.txt

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies and Linux gate tools
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb x11-utils poppler-utils fonts-noto-color-emoji
          git config --global user.email "ecpe-linux-ci@gstack.test"
          git config --global user.name "ECPE Linux CI"
          git config --global init.defaultBranch main
          git config --global --add safe.directory '*'

      - name: Build free-suite prerequisites
        shell: bash
        run: |
          set -euo pipefail
          bun run gen:skill-docs --host all
          bun run vendor:xterm
          bash browse/scripts/build-node-server.sh
          bun run build:gates

      - name: Run the complete free suite
        shell: bash
        env:
          GSTACK_EXPECT_BINARIES: "1"
          GSTACK_FREE_JOBS: "1"
          GSTACK_FLAKE_LEDGER: ${{ runner.temp }}/flake-ledger.jsonl
        run: xvfb-run -a bun run test:free

      - name: Upload Linux evidence and diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ecpe-v3-linux-proof
          path: |
            .ci-evidence/linux.txt
            ${{ runner.temp }}/flake-ledger.jsonl
            /tmp/gstack-free-test-*.log
          if-no-files-found: ignore
          retention-days: 30

  macos-authority-and-render:
    name: macOS authority and render gates
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.ECPE_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ECPE_TARGET_SHA"
          mkdir -p .ci-evidence
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "target_sha=$ECPE_TARGET_SHA"
            echo "actual_sha=$(git rev-parse HEAD)"
          } > .ci-evidence/macos.txt

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies and render tools
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          brew install poppler
          bunx playwright install chromium
          git config --global user.email "ecpe-macos-ci@gstack.test"
          git config --global user.name "ECPE macOS CI"
          git config --global init.defaultBranch main

      - name: Build all binaries
        shell: bash
        run: |
          set -euo pipefail
          bun run build
          for bin in browse/dist/browse browse/dist/find-browse design/dist/design make-pdf/dist/pdf; do
            codesign --remove-signature "$bin" 2>/dev/null || true
            codesign -s - -f "$bin" || true
          done

      - name: Run authority and installed-runtime boundaries
        shell: bash
        run: >-
          bun test --timeout 30000
          test/authority-build-coordination.test.ts
          test/authority-bundle-build.test.ts
          test/gstack-anchor.test.ts
          test/setup-authority-runtime.test.ts
          test/setup-host-section-delivery.test.ts
          test/setup-runtime-metadata.test.ts
          test/section-delivery.test.ts
          test/git-stage-commit-boundary.test.ts
          test/git-base-sync-adapter.test.ts
          test/document-release-adapter.test.ts

      - name: Run macOS make-pdf gates
        shell: bash
        env:
          BROWSE_BIN: ${{ github.workspace }}/browse/dist/browse
        run: |
          set -euo pipefail
          bun test make-pdf/test/*.test.ts test/diagram-render-drift.test.ts
          bun test make-pdf/test/e2e/

      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ecpe-v3-macos-proof
          path: .ci-evidence/macos.txt
          if-no-files-found: error
          retention-days: 30

  windows-runtime-and-free-suite:
    name: Windows runtime and curated free suite
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.ECPE_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert source identity
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:ECPE_TARGET_SHA) { throw "wrong source SHA: $actual" }
          New-Item -ItemType Directory -Force .ci-evidence | Out-Null
          @(
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "target_sha=$env:ECPE_TARGET_SHA"
            "actual_sha=$actual"
          ) | Set-Content -Encoding utf8 .ci-evidence/windows.txt

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Configure Git and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.email "ecpe-windows-ci@gstack.test"
          git config --global user.name "ECPE Windows CI"
          git config --global init.defaultBranch main
          bun install --frozen-lockfile

      - name: Build and generate Windows test prerequisites
        shell: bash
        env:
          GSTACK_SKIP_PLAYWRIGHT: "1"
        run: |
          set -euo pipefail
          bun run build
          bun run gen:skill-docs --host all

      - name: Run curated Windows-safe suite
        shell: bash
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun run test:windows

      - name: Exercise isolated Codex runtime and tamper guard
        shell: bash
        env:
          GSTACK_SKIP_PLAYWRIGHT: "1"
        run: |
          set -euo pipefail
          setup_home="$(mktemp -d "${RUNNER_TEMP}/gstack-setup-home.XXXXXX")"
          export HOME="$setup_home"
          export USERPROFILE="$(cygpath -w "$setup_home")"
          export CODEX_HOME="$setup_home/.codex"
          export GSTACK_HOME="$setup_home/.gstack"
          export XDG_CONFIG_HOME="$setup_home/.config"
          export XDG_STATE_HOME="$setup_home/.local/state"
          ./setup --host codex --model gpt-5.6-sol --no-team --quiet
          runtime="$CODEX_HOME/skills/gstack"
          test -f "$runtime/.ecpe-installed-runtime.json"
          test -f "$runtime/dist/authority/manifest.json"
          test ! -L "$runtime/bin"
          mv .ecpe-installed-runtime.json "$setup_home/source-runtime.json"
          if bash "$runtime/bin/gstack-effect-scope" > "$setup_home/effect.out" 2> "$setup_home/effect.err"; then
            echo "Native Windows authority mutation unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q 'ecpe_native_windows_unsupported' "$setup_home/effect.err"
          printf '\n// tamper probe\n' >> "$runtime/dist/authority/gstack-effect-scope.mjs"
          if bash "$runtime/bin/gstack-effect-scope" > "$setup_home/tamper.out" 2> "$setup_home/tamper.err"; then
            echo "Changed authority bundle unexpectedly ran" >&2
            exit 1
          fi
          grep -q 'authority_bundle_mismatch' "$setup_home/tamper.err"
          test ! -s "$setup_home/tamper.out"

      - name: Upload Windows evidence and diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ecpe-v3-windows-proof
          path: |
            .ci-evidence/windows.txt
            ${{ runner.temp }}/gstack-free-test-*.log
          if-no-files-found: ignore
          retention-days: 30
